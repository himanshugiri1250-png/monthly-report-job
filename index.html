<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Schedule Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-btn { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        h2 { color: #2c3e50; margin: 0; font-size: 1.2rem; }
        .counter-box { background: #e74c3c; color: white; padding: 10px; border-radius: 10px; margin: 15px 0; font-weight: bold; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-name { font-weight: bold; color: #7f8c8d; font-size: 0.8rem; padding-bottom: 5px; }
        
        .day { aspect-ratio: 1/1; background: #fff; border: 1px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; position: relative; }
        .day.absent::after { content: "❌"; font-size: 1.1rem; position: absolute; }
        .day.absent { background: #fdeaea; border-color: #fab1a0; }
        .day.empty { border: none; cursor: default; }

        .btn-reset { margin-top: 20px; padding: 10px; background: #95a5a6; color: white; border: none; border-radius: 8px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <button class="nav-btn" onclick="changeMonth(-1)">←</button>
        <h2 id="monthDisplay">Month Year</h2>
        <button class="nav-btn" onclick="changeMonth(1)">→</button>
    </div>
    
    <div class="counter-box">Total Absents: <span id="totalCount">0</span></div>

    <div class="calendar-grid" id="calendar"></div>

    <button class="btn-reset" onclick="clearMonthData()">Clear This Month</button>
</div>

<script>
    let currentDate = new Date(); // Aaj ki date
    const calendar = document.getElementById('calendar');
    const monthDisplay = document.getElementById('monthDisplay');
    const totalCountLabel = document.getElementById('totalCount');

    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function renderCalendar() {
        calendar.innerHTML = "";
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // Month and Year Title
        const monthName = new Intl.DateTimeFormat('en-US', { month: 'long' }).format(currentDate);
        monthDisplay.innerText = `${monthName} ${year}`;

        // Add Day Headers (Sun, Mon...)
        dayNames.forEach(name => {
            const div = document.createElement('div');
            div.classList.add('day-name');
            div.innerText = name;
            calendar.appendChild(div);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        
        // LocalStorage Key (Har mahine ke liye alag data)
        const storageKey = `absent_${year}_${month}`;
        let attendance = JSON.parse(localStorage.getItem(storageKey)) || {};

        // Empty spaces for previous month's days
        for (let x = 0; x < firstDayIndex; x++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('day', 'empty');
            calendar.appendChild(emptyDiv);
        }

        // Real Days of the month
        for (let i = 1; i <= lastDay; i++) {
            const daySquare = document.createElement('div');
            daySquare.classList.add('day');
            daySquare.innerText = i;

            if (attendance[i]) daySquare.classList.add('absent');

            daySquare.onclick = () => {
                if (attendance[i]) {
                    delete attendance[i];
                    daySquare.classList.remove('absent');
                } else {
                    attendance[i] = true;
                    daySquare.classList.add('absent');
                }
                localStorage.setItem(storageKey, JSON.stringify(attendance));
                updateCounter(attendance);
            };
            calendar.appendChild(daySquare);
        }
        updateCounter(attendance);
    }

    function updateCounter(attendance) {
        totalCountLabel.innerText = Object.keys(attendance).length;
    }

    function changeMonth(step) {
        currentDate.setMonth(currentDate.getMonth() + step);
        renderCalendar();
    }

    function clearMonthData() {
        if (confirm("Kya aap is mahine ka data delete karna chahte hain?")) {
            const storageKey = `absent_${currentDate.getFullYear()}_${currentDate.getMonth()}`;
            localStorage.removeItem(storageKey);
            renderCalendar();
        }
    }

    renderCalendar();
</script>

</body>
</html>
